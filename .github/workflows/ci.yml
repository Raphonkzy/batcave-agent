# Lint, test and build every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run guard
      - name: Package installs and starts
        run: |
          npm pack
          npm install --global --prefix "$RUNNER_TEMP/mc" ./batcave-agent-*.tgz
          if [ "$RUNNER_OS" = Windows ]; then
            node "$RUNNER_TEMP/mc/node_modules/batcave-agent/bin/batcave.js" --version
          else
            "$RUNNER_TEMP/mc/bin/batcave" --version
            bash -n install.sh
          fi
      - name: Installer script parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
